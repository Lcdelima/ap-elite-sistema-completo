<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#E6B76A"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6B76A"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" width="300%" height="300%" x="-100%" y="-100%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <path d="M150 200 L250 50 L350 200 Z" stroke="url(#grad1)" stroke-width="12" fill="none" stroke-linejoin="round"/>
    <path d="M200 150 L300 150" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <text x="400" y="155" fill="url(#grad1)" font-family="Sora" font-size="82" font-weight="600" letter-spacing="0.04em">ELITE</text>
  
  <text x="402" y="200" fill="#9AA6B2" font-family="Manrope" font-size="22" letter-spacing="0.15em">
    ESTRATÉGIAS EM PERÍCIA E INVESTIGAÇÃO CRIMINAL
  </text>
</svg>
