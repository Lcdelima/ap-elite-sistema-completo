<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Universo Elite Academy</title>
  <desc id="desc">Ambiente imersivo em azul profundo, preto e dourado com portal, tabuleiro estratégico, biblioteca e laboratório.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02070d"/><stop offset="0.52" stop-color="#071725"/><stop offset="1" stop-color="#020509"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a551d"/><stop offset="0.45" stop-color="#f0d08a"/><stop offset="1" stop-color="#8b6729"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14cdf1" stop-opacity="0"/><stop offset="0.5" stop-color="#14cdf1"/><stop offset="1" stop-color="#14cdf1" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#f5dda0" stop-opacity="0.35"/><stop offset="0.38" stop-color="#1bd2f6" stop-opacity="0.14"/><stop offset="1" stop-color="#06111c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#42cce8" stroke-opacity="0.08"/></pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#grid)"/>
  <ellipse cx="770" cy="450" rx="580" ry="470" fill="url(#glow)"/>

  <!-- strategic floor -->
  <g transform="translate(115 650) skewX(-10)" opacity="0.48">
    <rect x="0" y="0" width="1260" height="260" fill="#03070b" stroke="#8d682d"/>
    <g stroke="#b99145" stroke-width="2">
      <path d="M0 52h1260M0 104h1260M0 156h1260M0 208h1260"/>
      <path d="M105 0v260M210 0v260M315 0v260M420 0v260M525 0v260M630 0v260M735 0v260M840 0v260M945 0v260M1050 0v260M1155 0v260"/>
    </g>
    <g fill="#0b1a24"><rect x="0" y="0" width="105" height="52"/><rect x="210" y="0" width="105" height="52"/><rect x="420" y="0" width="105" height="52"/><rect x="630" y="0" width="105" height="52"/><rect x="840" y="0" width="105" height="52"/><rect x="1050" y="0" width="105" height="52"/><rect x="105" y="52" width="105" height="52"/><rect x="315" y="52" width="105" height="52"/><rect x="525" y="52" width="105" height="52"/><rect x="735" y="52" width="105" height="52"/><rect x="945" y="52" width="105" height="52"/><rect x="1155" y="52" width="105" height="52"/></g>
  </g>

  <!-- central portal -->
  <g transform="translate(500 90)">
    <rect x="0" y="0" width="500" height="650" fill="#03080c" stroke="#8e682e" stroke-width="3"/>
    <rect x="28" y="28" width="444" height="594" fill="#07151f" stroke="#273f4b"/>
    <path d="M75 620V260C75 130 160 62 250 62s175 68 175 198v360" fill="#02070b" stroke="url(#gold)" stroke-width="5"/>
    <path d="M108 620V279c0-101 66-156 142-156s142 55 142 156v341" fill="#07131c" stroke="#5fcbe4" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="134" y="303" width="232" height="317" fill="#03080c" stroke="#b18a45"/>
    <rect x="148" y="318" width="204" height="302" fill="#071826"/>
    <rect x="238" y="318" width="24" height="302" fill="url(#cyan)" opacity="0.68"/>
    <path d="M148 318h204v302H148z" fill="url(#grid)" opacity="0.42"/>
    <text x="250" y="390" text-anchor="middle" fill="#e6c77e" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">ENTRE NO UNIVERSO</text>
    <text x="250" y="448" text-anchor="middle" fill="#f4f7f8" font-family="Georgia, serif" font-size="40">ELITE</text>
    <text x="250" y="485" text-anchor="middle" fill="#58d3ee" font-family="Arial, sans-serif" font-size="16" letter-spacing="7">ACADEMY</text>
    <text x="250" y="540" text-anchor="middle" fill="#8094a0" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">MISSÕES · LABORATÓRIOS · COMUNIDADE</text>
    <rect x="188" y="566" width="124" height="30" fill="none" stroke="#c6a05a"/>
    <text x="250" y="586" text-anchor="middle" fill="#ddb96d" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">ACESSO CONTROLADO</text>
  </g>

  <!-- left library -->
  <g transform="translate(72 140)">
    <rect x="0" y="0" width="345" height="510" fill="#050d14" stroke="#6e552a"/>
    <rect x="24" y="28" width="297" height="24" fill="#0c1b25"/>
    <text x="40" y="45" fill="#d7b66d" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">BIBLIOTECA ESTRATÉGICA</text>
    <g fill="#0d202b" stroke="#233e4a">
      <rect x="24" y="78" width="297" height="112"/><rect x="24" y="210" width="297" height="112"/><rect x="24" y="342" width="297" height="112"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="4">
      <rect x="48" y="104" width="28" height="61"/><rect x="84" y="93" width="34" height="72"/><rect x="126" y="111" width="24" height="54"/><rect x="158" y="98" width="42" height="67"/><rect x="209" y="106" width="31" height="59"/><rect x="248" y="90" width="42" height="75"/>
      <rect x="48" y="236" width="36" height="61"/><rect x="92" y="247" width="28" height="50"/><rect x="128" y="224" width="42" height="73"/><rect x="178" y="241" width="32" height="56"/><rect x="219" y="230" width="28" height="67"/><rect x="255" y="219" width="35" height="78"/>
      <rect x="48" y="368" width="28" height="61"/><rect x="84" y="353" width="38" height="76"/><rect x="130" y="378" width="28" height="51"/><rect x="166" y="362" width="44" height="67"/><rect x="218" y="371" width="27" height="58"/><rect x="253" y="347" width="37" height="82"/>
    </g>
  </g>

  <!-- right laboratory -->
  <g transform="translate(1080 150)">
    <rect x="0" y="0" width="345" height="500" fill="#050d14" stroke="#6e552a"/>
    <rect x="24" y="28" width="297" height="24" fill="#0c1b25"/>
    <text x="40" y="45" fill="#d7b66d" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">LABORATÓRIO DE EVIDÊNCIAS</text>
    <rect x="24" y="76" width="297" height="180" fill="#071722" stroke="#23404c"/>
    <path d="M48 220l48-42 43 19 45-68 48 31 56-77" fill="none" stroke="#28cce9" stroke-width="4"/>
    <g fill="#d8b76b"><rect x="44" y="216" width="8" height="8"/><rect x="92" y="174" width="8" height="8"/><rect x="135" y="193" width="8" height="8"/><rect x="180" y="125" width="8" height="8"/><rect x="228" y="156" width="8" height="8"/><rect x="284" y="79" width="8" height="8"/></g>
    <g transform="translate(24 278)">
      <rect width="142" height="88" fill="#0a1d28" stroke="#24414c"/><rect x="155" width="142" height="88" fill="#0a1d28" stroke="#24414c"/><rect y="101" width="297" height="88" fill="#0a1d28" stroke="#24414c"/>
      <text x="16" y="27" fill="#718692" font-family="Arial, sans-serif" font-size="9">CADEIA DE CUSTÓDIA</text><text x="171" y="27" fill="#718692" font-family="Arial, sans-serif" font-size="9">METADADOS</text><text x="16" y="128" fill="#718692" font-family="Arial, sans-serif" font-size="9">DOSSIÊ TÉCNICO</text>
      <text x="16" y="62" fill="#e8c87e" font-family="Georgia, serif" font-size="24">100%</text><text x="171" y="62" fill="#e8c87e" font-family="Georgia, serif" font-size="24">SHA-256</text><text x="16" y="165" fill="#e8c87e" font-family="Georgia, serif" font-size="24">PRONTO</text>
    </g>
  </g>

  <!-- chess pieces and knowledge markers -->
  <g fill="url(#gold)" opacity="0.84">
    <path d="M330 810h58l-8 56h-42zM342 784h34l6 20h-46zM350 756h18l8 22h-34z"/>
    <path d="M1110 790h70l-12 72h-46zM1120 760h50l8 24h-66zM1132 720h26l18 34h-62z"/>
    <path d="M1250 825h60l-8 42h-44zM1260 799h40l6 20h-52zM1272 770h18l8 23h-34z"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6c818e">
    <text x="130" y="930">NÃO SEJA A PEÇA. LEIA O TABULEIRO.</text>
    <text x="1115" y="930">DO PRINT AO DOSSIÊ.</text>
  </g>
  <rect x="18" y="18" width="1464" height="964" fill="none" stroke="#b48a43" stroke-opacity="0.25" stroke-width="2"/>
</svg>