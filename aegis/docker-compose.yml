version: '3.8'

services:
  postgres-aegis:
    image: timescale/timescaledb:latest-pg15
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5433:5432"
    volumes:
      - aegis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aegis-data:
